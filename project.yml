name: AgentsHoldingApp
options:
  bundleIdPrefix: dev.agentsholding
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  knownRegions:
    - en
    - vi
    - Base
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_LANGUAGE: en
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    from: "1.1.0"
targets:
  AgentsHoldingApp:
    type: application
    platform: macOS
    sources:
      - path: AgentsHoldingApp
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: HighlightSwift
        product: HighlightSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentsholding.app
        PRODUCT_NAME: AgentsHoldingApp
        MARKETING_VERSION: "1.1.2"
        CURRENT_PROJECT_VERSION: "112"
        INFOPLIST_KEY_CFBundleDisplayName: Agents Holding
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Generate (SwiftGen)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export SKIP_XCODEGEN=1
          if [ -x "${SRCROOT}/Scripts/generate.sh" ]; then
            "${SRCROOT}/Scripts/generate.sh"
          else
            echo "warning: Scripts/generate.sh missing" >&2
          fi
    info:
      path: AgentsHoldingApp/Info.plist
      properties:
        CFBundleDisplayName: Agents Holding
        CFBundleShortVersionString: "1.1.2"
        CFBundleVersion: "112"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
